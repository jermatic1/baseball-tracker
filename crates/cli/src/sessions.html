<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sessions</title>
<link rel="stylesheet" href="/page.css">
<style>
#sessions td { vertical-align: top; }
.chip { display: inline-block; background: #234; color: #cdf; padding: 1px 6px; margin: 0 4px 2px 0; border-radius: 8px; cursor: pointer; }
.chip:hover { text-decoration: line-through; }
#sessions input.tag { width: 7em; padding: 2px 4px; margin: 0; }
#sessions input.notes { width: 14em; padding: 2px 4px; margin: 0; }
.training button { padding: 2px 6px; margin: 0; }
.training button.on { background: #9cf; color: #111; }
.changed { color: #fc6; }
.trained { color: #9c9; }
</style>
</head>
<body>
<nav><a href="/">Tracker</a><a href="/setup">Setup</a><a href="/sessions" class="here">Sessions</a><a href="/train">Train</a></nav>
<h1>Sessions</h1>
<input id="filter" placeholder="filter: tag, user, notes, model">
<div id="untrained" class="mono"></div>
<div id="status"></div>
<datalist id="known-tags"></datalist>
<table id="sessions">
  <thead><tr><th>session</th><th>started</th><th>user</th><th>activity</th><th>clips</th><th>reviewed</th><th>exp/gain</th><th>model</th><th>tags</th><th>notes</th><th>training</th><th></th><th></th></tr></thead>
  <tbody></tbody>
</table>
<script src="/page.js"></script>
<script>
const TRAINING = [["include", "include"], ["holdout", "hold out"], ["none", "none"]];
const status = document.getElementById("status");
let sessions = [];

function link(row, href, text) {
  const td = document.createElement("td");
  const a = document.createElement("a");
  a.href = href;
  a.textContent = text;
  td.appendChild(a);
  row.appendChild(td);
}

function date(started) {
  return started ? started.replace("T", " ").replace("Z", "") : "";
}

// Send a change; the reply is the session's updated row.
async function save(s, change) {
  const r = await fetch(`/api/sessions/${s.id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(change),
  });
  if (!r.ok) {
    status.textContent = `session ${s.id}: ${await r.text()}`;
    return false;
  }
  Object.assign(s, await r.json());
  status.textContent = "";
  return true;
}

function knownTags() {
  const tags = new Set(sessions.flatMap((s) => s.tags));
  const list = document.getElementById("known-tags");
  list.replaceChildren(...[...tags].sort().map((t) => {
    const o = document.createElement("option");
    o.value = t;
    return o;
  }));
}

function tagsCell(tr, s) {
  const td = document.createElement("td");
  const draw = () => {
    td.replaceChildren();
    s.tags.forEach((t) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = t;
      chip.title = "remove";
      chip.onclick = async () => {
        if (await save(s, { tags: s.tags.filter((x) => x !== t) })) { draw(); knownTags(); }
      };
      td.appendChild(chip);
    });
    const input = document.createElement("input");
    input.className = "tag";
    input.placeholder = "add tag";
    input.setAttribute("list", "known-tags");
    input.onkeydown = async (e) => {
      if (e.key !== "Enter" && e.key !== ",") return;
      e.preventDefault();
      const tag = input.value.trim();
      if (!tag || s.tags.includes(tag)) { input.value = ""; return; }
      if (await save(s, { tags: [...s.tags, tag] })) {
        draw();
        knownTags();
        td.querySelector("input").focus();
      }
    };
    td.appendChild(input);
  };
  draw();
  tr.appendChild(td);
}

function notesCell(tr, s) {
  const td = document.createElement("td");
  const input = document.createElement("input");
  input.className = "notes";
  input.value = s.notes;
  input.onchange = async () => {
    if (!(await save(s, { notes: input.value }))) input.value = s.notes;
  };
  td.appendChild(input);
  tr.appendChild(td);
}

// Sessions with reviewed clips marked include that the live model did not
// train on.
function showUntrained() {
  const n = sessions.filter((s) => s.training === "include" && s.reviewed > 0 && !s.trained).length;
  document.getElementById("untrained").textContent = `${n} reviewed sessions not yet trained on`;
}

function trainingCell(tr, s) {
  const td = document.createElement("td");
  td.className = "training";
  const draw = () => {
    td.replaceChildren(...TRAINING.map(([value, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = s.training === value ? "on" : "";
      b.onclick = async () => { if (await save(s, { training: value })) { draw(); showUntrained(); } };
      return b;
    }));
    if (s.trained) {
      const mark = document.createElement("span");
      mark.className = "trained";
      mark.textContent = " trained";
      mark.title = "the live model trained on this session";
      td.appendChild(mark);
    }
  };
  draw();
  tr.appendChild(td);
}

function render(s) {
  const tr = document.createElement("tr");
  cell(tr, s.id === "none" ? "no session" : s.id);
  cell(tr, date(s.started));
  cell(tr, s.user || "");
  cell(tr, s.activity || "");
  cell(tr, s.clips);
  cell(tr, s.reviewed);
  cell(tr, s.exposure != null ? `${s.exposure}/${s.gain}` : "");
  const model = document.createElement("td");
  if (s.model) {
    model.textContent = `${s.model.file} ${s.model.sha1.slice(0, 7)}`;
    model.title = s.model.sha1;
  }
  if (s.calibration_changed) {
    const mark = document.createElement("span");
    mark.className = "changed";
    mark.textContent = " recalibrated";
    mark.title = "the mount differs from the previous session's";
    model.appendChild(mark);
  }
  tr.appendChild(model);
  tagsCell(tr, s);
  notesCell(tr, s);
  trainingCell(tr, s);
  if (s.clips > 0) {
    link(tr, `/sessions/${s.id}/label/`, "label");
    link(tr, `/sessions/${s.id}/playback/`, "playback");
  }
  s.row = tr;
  return tr;
}

function matches(s, words) {
  const text = [...s.tags, s.user || "", s.notes, s.model ? `${s.model.file} ${s.model.sha1}` : ""]
    .join(" ").toLowerCase();
  return words.every((w) => text.includes(w));
}

function applyFilter() {
  const words = document.getElementById("filter").value.toLowerCase().split(/\s+/).filter(Boolean);
  sessions.forEach((s) => { s.row.hidden = !matches(s, words); });
}

document.getElementById("filter").oninput = applyFilter;

fetch("/api/sessions").then((r) => r.json()).then((rows) => {
  sessions = rows;
  document.querySelector("#sessions tbody").replaceChildren(...rows.map(render));
  knownTags();
  applyFilter();
  showUntrained();
}).catch((e) => {
  status.textContent = String(e);
});
</script>
</body>
</html>
