<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tracker</title>
<style>
body { font: 14px sans-serif; background: #111; color: #eee; margin: 16px; }
img { background: #000; max-width: 100%; display: block; }
#view { position: relative; display: inline-block; }
#boxes, #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
button { margin: 4px 4px 0 0; padding: 6px 10px; }
.row { margin-top: 12px; }
.mono { font-family: monospace; margin-top: 6px; }
#camera { color: #9c9; }
#detector { color: #fc6; }
#calibration { color: #6cf; }
#status { margin-top: 8px; min-height: 1.2em; }
table { border-collapse: collapse; margin-top: 12px; font-family: monospace; }
td, th { padding: 2px 10px; text-align: right; border-bottom: 1px solid #333; }
th { color: #aaa; font-weight: normal; }
</style>
</head>
<body>
<h1>Tracker</h1>
<div id="view">
  <img id="preview" alt="live preview" width="640">
  <canvas id="boxes" width="640" height="400"></canvas>
  <canvas id="overlay" width="640" height="400"></canvas>
</div>
<div id="camera" class="mono">connecting</div>
<div id="detector" class="mono"></div>
<div id="calibration" class="mono"></div>
<div class="row">
  <button data-set="exposure" data-delta="-100">Exposure −100 µs</button>
  <button data-set="exposure" data-delta="100">Exposure +100 µs</button>
  <button data-set="gain" data-delta="-100">ISO −100</button>
  <button data-set="gain" data-delta="100">ISO +100</button>
  <button data-set="ir_flood" data-delta="-0.2">Flood −20%</button>
  <button data-set="ir_flood" data-delta="0.2">Flood +20%</button>
  <button data-set="ir_dot" data-delta="-0.2">Dot −20%</button>
  <button data-set="ir_dot" data-delta="0.2">Dot +20%</button>
</div>
<div class="row">
  <button id="record">Record</button>
  <button id="stop" disabled>Stop</button>
  <button id="calibrate">Calibrate</button>
  <button id="apply" hidden>Apply</button>
  <button id="cancel" hidden>Cancel</button>
</div>
<p>Calibrate with the plate clear and no ball on it. Detected plate in green, fitted pose in yellow. Capture pauses while calibrating.</p>
<div class="row">
  <select id="user"></select>
  <input id="new-user" placeholder="new user" size="12">
  <button id="add-user">Add user</button>
  <select id="activity"><option>hitting</option><option>pitching</option></select>
  <select id="mode"><option>practice</option><option>game</option></select>
  <button id="start">Start session</button>
  <button id="end" hidden>End session</button>
</div>
<div id="session" class="mono">no session</div>
<div id="summary" class="mono"></div>
<div id="status"></div>
<table id="events">
  <thead><tr><th>clip</th><th>kind</th><th>type</th><th>mph</th><th>launch</th><th>spray</th><th>carry ft</th><th>pitch</th><th>plate mph</th><th>location</th><th>simulated</th><th>call</th><th>contact</th><th>samples</th></tr></thead>
  <tbody></tbody>
</table>
<script>
const img = document.getElementById("preview");
const statusEl = document.getElementById("status");
const cameraEl = document.getElementById("camera");
const detectorEl = document.getElementById("detector");
const calibEl = document.getElementById("calibration");
const events = document.querySelector("#events tbody");
const userEl = document.getElementById("user");
const sessionEl = document.getElementById("session");
const summaryEl = document.getElementById("summary");
let users = [];
let session = null;
let ws = null;
let url = null;
let controls = { exposure: 600, gain: 1600, ir_flood: 0, ir_dot: 0 };
let retry = 1000;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "blob";
  ws.onopen = () => {
    retry = 1000;
    send({ type: "hello", client: "page" });
    send({ type: "preview", enabled: true });
    statusEl.textContent = "";
  };
  ws.onmessage = (e) => {
    if (e.data instanceof Blob) {
      const next = URL.createObjectURL(e.data);
      img.src = next;
      if (url) URL.revokeObjectURL(url);
      url = next;
      return;
    }
    handle(JSON.parse(e.data));
  };
  ws.onclose = () => {
    cameraEl.textContent = "disconnected, retrying";
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 10000);
  };
}
function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}
function handle(m) {
  if (m.type === "status") {
    const c = m.camera;
    cameraEl.textContent = c
      ? `left ${c.left_rate} fps, right ${c.right_rate} fps, pairs ${c.pair_rate} fps | gaps L${c.left_gaps} R${c.right_gaps}, unpaired ${c.unpaired}` +
        ` | clients ${m.clients.join(", ") || "none"} | ${m.capturing ? "capturing" : "idle"}` +
        ` | ${m.exposure} µs, ISO ${m.gain}, flood ${Math.round(m.ir_flood * 100)}%, dot ${Math.round(m.ir_dot * 100)}%`
      : "waiting for the camera";
    controls = { exposure: m.exposure, gain: m.gain, ir_flood: m.ir_flood, ir_dot: m.ir_dot };
    const d = m.detector;
    detectorEl.textContent = d
      ? `detector ${d.state} | ${d.rate.toFixed(0)} fps on ${d.provider}, ${d.lag} behind, ${d.drops} dropped | clips ${d.clips}` +
        (d.last_event ? ` | ${d.last_event}` : "")
      : "";
    drawBoxes(d ? d.boxes : []);
    document.getElementById("record").disabled = m.recording;
    document.getElementById("stop").disabled = !m.recording;
    setCalibrating(m.calibrating);
    if (!m.calibrating) {
      calibEl.textContent = `mount: ${m.mount.distance.toFixed(1)} ft from plate, ${m.mount.height.toFixed(1)} ft high, lateral ${m.mount.lateral.toFixed(1)} ft`;
    }
  } else if (m.type === "event") {
    const r = m.record;
    const row = document.createElement("tr");
    const num = (v, d) => (v == null ? "-" : v.toFixed(d));
    const loc = (l) => (l ? `${l.side.toFixed(0)}, ${l.height.toFixed(0)} in` : "-");
    [m.clip, r.kind, r.hit_type || "-", num(r.exit_velocity, 1), num(r.launch_angle, 1),
     num(r.spray_angle, 1), r.hit ? r.hit.carry.toFixed(0) : "-", num(r.pitch_velocity, 1),
     r.pitch ? r.pitch.plate_velocity.toFixed(1) : "-", loc(r.pitch && r.pitch.location),
     loc(r.pitch && r.pitch.simulated_location), r.pitch ? r.pitch.call : "-",
     r.contact ? r.contact.kind : "-", r.samples]
      .forEach((v) => { const td = document.createElement("td"); td.textContent = v; row.appendChild(td); });
    events.prepend(row);
    while (events.children.length > 20) events.lastChild.remove();
  } else if (m.type === "calibration") {
    drawPlate(m);
    if (!m.found) {
      calibEl.textContent = "calibrating: plate not found";
    } else {
      const p = m.mount;
      calibEl.textContent = `${m.applied ? "applied" : "calibrating"}: rms ${m.rms.toFixed(2)} px, ` +
        `${p.distance.toFixed(1)} ft from plate, ${p.height.toFixed(1)} ft high, lateral ${p.lateral.toFixed(1)} ft, yaw ${p.yaw.toFixed(1)}, pitch ${p.pitch.toFixed(1)}`;
    }
  } else if (m.type === "users") {
    users = m.users;
    const chosen = userEl.value;
    userEl.replaceChildren(...users.map((u) => new Option(u.name, u.id)));
    if (users.some((u) => u.id === chosen)) userEl.value = chosen;
  } else if (m.type === "session") {
    session = m.session;
    if (session) {
      const user = users.find((u) => u.id === session.user);
      sessionEl.textContent = `session ${session.id}: ${user ? user.name : session.user} ${session.activity}, ${session.mode}`;
      summaryEl.textContent = "";
    } else {
      sessionEl.textContent = "no session";
    }
    document.getElementById("start").hidden = !!session;
    document.getElementById("end").hidden = !session;
  } else if (m.type === "session_summary") {
    const user = users.find((u) => u.id === m.user);
    summaryEl.textContent = `session ${m.session} (${user ? user.name : m.user}): ` +
      m.lines.map((l) => `${l.label} ${l.value}`).join(" | ");
  } else if (m.type === "error") {
    statusEl.textContent = m.request ? `${m.request}: ${m.message}` : m.message;
  }
}
function fit(canvas) {
  canvas.width = img.naturalWidth || 640;
  canvas.height = img.naturalHeight || 400;
  canvas.style.width = img.clientWidth + "px";
  canvas.style.height = img.clientHeight + "px";
  return canvas.getContext("2d");
}
function drawBoxes(list) {
  const ctx = fit(document.getElementById("boxes"));
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.strokeStyle = "#f80";
  ctx.lineWidth = 2;
  list.forEach((b) => ctx.strokeRect(b[0], b[1], b[2], b[3]));
}
function drawPlate(m) {
  const ctx = fit(document.getElementById("overlay"));
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  const poly = (pts, color) => {
    if (!pts) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath();
    ctx.stroke();
  };
  poly(m.corners, "#0f0");
  poly(m.reprojected, "#ff0");
}
function setCalibrating(on) {
  document.getElementById("calibrate").hidden = on;
  document.getElementById("apply").hidden = !on;
  document.getElementById("cancel").hidden = !on;
  if (!on) fit(document.getElementById("overlay")).clearRect(0, 0, 640, 400);
}
document.querySelectorAll("[data-set]").forEach((b) => {
  b.onclick = () => {
    const key = b.dataset.set;
    const value = controls[key] + Number(b.dataset.delta);
    send({ type: "set", [key]: key === "exposure" || key === "gain" ? Math.round(value) : value });
  };
});
document.getElementById("record").onclick = () => send({ type: "record", action: "start" });
document.getElementById("stop").onclick = () => send({ type: "record", action: "stop" });
document.getElementById("calibrate").onclick = () => send({ type: "calibrate", action: "start" });
document.getElementById("apply").onclick = () => send({ type: "calibrate", action: "apply" });
document.getElementById("cancel").onclick = () => send({ type: "calibrate", action: "stop" });
document.getElementById("add-user").onclick = () => {
  const input = document.getElementById("new-user");
  if (input.value.trim()) send({ type: "add_user", name: input.value.trim() });
  input.value = "";
};
document.getElementById("start").onclick = () => send({
  type: "start_session",
  user: userEl.value,
  activity: document.getElementById("activity").value,
  mode: document.getElementById("mode").value,
});
document.getElementById("end").onclick = () => { if (session) send({ type: "end_session", session: session.id }); };
connect();
</script>
</body>
</html>
