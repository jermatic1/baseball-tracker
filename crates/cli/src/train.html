<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>train</title>
<link rel="stylesheet" href="/page.css">
<style>
#log { white-space: pre-wrap; background: #000; color: #ccc; padding: 8px; max-height: 24em; overflow-y: auto; margin-top: 8px; }
#scores td:first-child { text-align: left; }
.better { color: #9c9; }
.worse { color: #f88; }
#message { margin-top: 8px; color: #9c9; }
</style>
</head>
<body>
<nav><a href="/">Tracker</a><a href="/setup">Setup</a><a href="/sessions">Sessions</a><a href="/train" class="here">Train</a></nav>
<h1>Train</h1>
<div id="server" class="mono"></div>
<h2>Training on</h2>
<table id="include"><thead><tr><th>session</th><th>ball frames</th><th>empty frames</th><th>clicks</th></tr></thead><tbody></tbody></table>
<h2>Held out for testing</h2>
<table id="holdout"><thead><tr><th>session</th><th>ball frames</th><th>empty frames</th><th>clicks</th></tr></thead><tbody></tbody></table>
<div class="row"><button id="train" disabled>Train</button> <span id="phase" class="mono"></span></div>
<div id="status"></div>
<div id="log" hidden></div>
<div id="result" hidden>
  <h2>Candidate against the held-out sessions</h2>
  <table id="scores"><thead><tr><th></th><th>candidate</th><th>current</th></tr></thead><tbody></tbody></table>
  <div class="row"><button id="promote">Promote</button></div>
  <div id="message"></div>
</div>
<script>
const ACTIVE = ["building", "sending", "queued", "running"];
// Label, result key, and whether more is better.
const SCORES = [["recall", "recall", true], ["false per empty frame", "false_per_empty", false], ["mAP50", "map50", true]];
const status = document.getElementById("status");
const button = document.getElementById("train");
let server = "";
let serverBusy = false;
let timer = null;

function cell(row, text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  row.appendChild(td);
}

function sessionRows(id, rows) {
  const body = document.querySelector(`#${id} tbody`);
  if (!rows.length) {
    const tr = document.createElement("tr");
    cell(tr, "none; choose on the Sessions page");
    body.replaceChildren(tr);
    return;
  }
  body.replaceChildren(...rows.map((s) => {
    const tr = document.createElement("tr");
    cell(tr, s.id);
    if (s.error) {
      cell(tr, s.error, "worse");
      return tr;
    }
    [s.ball, s.empty, s.clicks].forEach((v) => cell(tr, v));
    return tr;
  }));
}

function fmt(v) {
  return typeof v === "number" ? v.toFixed(3) : "-";
}

function scores(result) {
  const body = document.querySelector("#scores tbody");
  const cand = result.candidate || {};
  const cur = result.current || {};
  body.replaceChildren(...SCORES.map(([label, key, up]) => {
    const tr = document.createElement("tr");
    cell(tr, label);
    let cls = "";
    if (typeof cand[key] === "number" && typeof cur[key] === "number" && cand[key] !== cur[key]) {
      cls = (cand[key] > cur[key]) === up ? "better" : "worse";
    }
    cell(tr, fmt(cand[key]), cls);
    cell(tr, fmt(cur[key]));
    return tr;
  }));
  const extra = [];
  if (result.epochs != null) extra.push(`${result.epochs} epochs`);
  if (result.frames != null) extra.push(`${result.frames} frames`);
  if (!result.current) extra.push("no current model to compare");
  const tr = document.createElement("tr");
  cell(tr, extra.join(", "));
  body.appendChild(tr);
}

function showJob(job) {
  const active = ACTIVE.includes(job.phase);
  let phase = job.phase === "idle" ? "" : job.phase;
  if (job.built) phase += ` (${job.built.train} train, ${job.built.val} val, ${job.built.holdout} held out)`;
  document.getElementById("phase").textContent = phase;
  status.textContent = job.error || (active ? "a job is running; only one runs at a time" : (serverBusy ? "the training server is busy with another job" : ""));
  const log = document.getElementById("log");
  log.hidden = !job.log;
  if (log.textContent !== job.log) {
    log.textContent = job.log;
    log.scrollTop = log.scrollHeight;
  }
  const result = document.getElementById("result");
  result.hidden = !(job.phase === "done" && job.result);
  if (!result.hidden) scores(job.result);
  document.getElementById("promote").disabled = !!job.promoted;
  document.getElementById("message").textContent = job.promoted || "";
  button.disabled = !server || active || serverBusy;
  if (active && !timer) timer = setInterval(poll, 1000);
  if (!active && timer) {
    clearInterval(timer);
    timer = null;
  }
}

async function poll() {
  const r = await fetch("/api/train/job");
  if (r.ok) showJob(await r.json());
}

async function load() {
  const r = await fetch("/api/train");
  if (!r.ok) {
    status.textContent = await r.text();
    return;
  }
  const o = await r.json();
  server = o.server;
  serverBusy = !!(o.health && o.health.busy);
  let line = "no training server is configured; set [training] server in config.toml (local training comes later)";
  if (server) {
    const health = o.health_error ? `unreachable: ${o.health_error}` : (o.health.ok ? (serverBusy ? "busy" : "ready") : "not ok");
    line = `server ${server}: ${health}`;
  }
  document.getElementById("server").textContent = `${line}; model ${o.model}`;
  sessionRows("include", o.include);
  sessionRows("holdout", o.holdout);
  showJob(o.job);
}

button.onclick = async () => {
  button.disabled = true;
  const r = await fetch("/api/train", { method: "POST" });
  if (!r.ok) status.textContent = await r.text();
  poll();
};

document.getElementById("promote").onclick = async (e) => {
  e.target.disabled = true;
  const r = await fetch("/api/train/promote", { method: "POST" });
  if (!r.ok) {
    status.textContent = await r.text();
    e.target.disabled = false;
    return;
  }
  document.getElementById("message").textContent = (await r.json()).message;
};

load();
</script>
</body>
</html>
