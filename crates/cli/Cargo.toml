[package]
name = "cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "tracker"
path = "src/main.rs"

[features]
default = ["nvidia"]
oak = ["device/oak", "detect"]
detect = ["dep:ultralytics-inference"]
nvidia = ["detect", "ultralytics-inference/nvidia"]
# Load the board's own ONNX Runtime at start instead of linking one in.
load-dynamic = ["nvidia", "dep:ort", "ort/load-dynamic"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
device = { path = "../device" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracker = { path = "../tracker" }
ultralytics-inference = { version = "0.0.48", optional = true, default-features = false }
ort = { version = "2.0.0-rc.13", optional = true, default-features = false }
