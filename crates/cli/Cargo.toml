[package]
name = "cli"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "tracker"
path = "src/main.rs"

[features]
default = ["detect", "challenges"]
oak = ["device/oak", "detect"]
challenges = ["dep:challenges"]
detect = ["dep:ultralytics-inference", "ultralytics-inference/nvidia", "dep:ort", "ort/load-dynamic", "ort/cuda", "ort/tensorrt", "dep:sha1"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
challenges = { path = "../challenges", optional = true }
clap = { version = "4", features = ["derive"] }
device = { path = "../device" }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["full"] }
tracker = { path = "../tracker" }
ultralytics-inference = { version = "0.0.48", optional = true, default-features = false }
ort = { version = "2.0.0-rc.13", optional = true, default-features = false }
