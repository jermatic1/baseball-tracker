# The tracker on a Jetson. Save as compose.yaml and run: docker compose up -d
services:
  tracker:
    image: ghcr.io/jermatic1/baseball-tracker/tracker:jetson
    runtime: nvidia
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./models:/opt/tracker/models
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"

  # Play a recorded session through the live path beside the tracker, with
  # its pages on port 7881: SESSION=3 docker compose run --rm replay
  replay:
    image: ghcr.io/jermatic1/baseball-tracker/tracker:jetson
    runtime: nvidia
    network_mode: host
    profiles: [replay]
    volumes:
      - ./data:/data
      - ./data-replay:/data-replay
      - ./models:/opt/tracker/models
    command: watch /data-replay --from /data/sessions/${SESSION:-1} --gap 2 --bind 0.0.0.0:7881

  # To train on the board too: uncomment, mkdir runs, and set the tracker's
  # [training] server to http://localhost:7882.
  # train-server:
  #   image: ghcr.io/jermatic1/baseball-tracker/train:cuda
  #   runtime: nvidia
  #   network_mode: host
  #   restart: unless-stopped
  #   shm_size: 2g
  #   volumes:
  #     - ./runs:/work/runs
