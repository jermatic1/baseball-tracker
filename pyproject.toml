# task train installs these with `uv pip install --torch-backend=auto`.
# Do not uv lock. The default Linux torch wheel is CUDA.

[project]
name = "tracker-train"
version = "0.1.0"
description = "Fine-tune the ball detector and export ONNX"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "ultralytics>=8.4",
]

[tool.uv]
package = false
# `task onnxruntime` installs this and copies the libraries next to the binary.
[dependency-groups]
onnxruntime = [
    "onnxruntime-gpu==1.31.0; platform_machine == 'x86_64'",
    "onnxruntime-gpu @ https://github.com/ultralytics/assets/releases/download/v0.0.0/onnxruntime_gpu-1.24.0-cp312-cp312-linux_aarch64.whl ; platform_machine == 'aarch64'",
]
