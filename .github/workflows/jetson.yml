# Build the tracker for the Jetson (aarch64, JetPack 7.2 = Ubuntu 24.04) on
# GitHub's arm64 runners. The first run compiles depthai-core and its vcpkg
# dependencies, which takes about an hour; the cache makes later runs short.
# Every push to main replaces the bundle on the "latest" release, which
# install.sh fetches.
name: jetson

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake ninja-build pkg-config \
            python3 autoconf automake autoconf-archive libtool libudev-dev \
            libssl-dev nasm libdw-dev libelf-dev curl git
          sh -c "$(curl -sL https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6

      - name: Cache depthai-core and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.depthai-rs
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: jetson-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: jetson-${{ runner.arch }}-

      - name: Build
        env:
          CARGO_BUILD_JOBS: 3
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: task release

      - name: Package
        run: |
          echo "built $(git rev-parse --short HEAD)" > dist/release/VERSION
          tar -C dist/release -czf dist/tracker-jetson-aarch64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: tracker-jetson-aarch64
          path: dist/tracker-jetson-aarch64.tar.gz

      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Update the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}.
          files: dist/tracker-jetson-aarch64.tar.gz
