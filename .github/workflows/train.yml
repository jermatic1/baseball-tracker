# Build and publish the training server images: train:cuda for the Jetson
# (arm64) and train:rocm for an AMD machine (x86_64), when what goes into
# them changes.
name: train

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - tools/**
      - docker/train/**
      - .github/workflows/train.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - target: cuda
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - target: rocm
            runner: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the GPU wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/train/Dockerfile
          build-args: TARGET=${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/train:${{ matrix.target }}
            ghcr.io/${{ github.repository }}/train:${{ matrix.target }}-${{ github.sha }}
