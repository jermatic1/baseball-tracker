version: "3"

vars:
  DATA: '{{.DATA | default "data"}}'
  FROM: '{{.FROM | default "data"}}'
  GAP: '{{.GAP | default "1"}}'

tasks:
  build:
    deps: [web]
    desc: Build the tracker
    cmds:
      - cargo build -p cli

  build-oak:
    deps: [web]
    desc: Build capture with the OAK camera
    cmds:
      - cargo build -p cli --features oak

  test:
    desc: Run tracker tests
    cmds:
      - cargo test --workspace

  fmt:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy --workspace --all-targets --features oak -- -D warnings
      - cargo clippy -p cli --all-targets --no-default-features --features detect -- -D warnings

  web-deps:
    desc: Install the web app's dependencies
    dir: web
    cmds:
      - npm ci
    sources: [package-lock.json]
    generates: [node_modules/.package-lock.json]

  web:
    desc: Type-check and build the web app into web/build, which the tracker embeds
    deps: [web-deps]
    dir: web
    cmds:
      - npm run check
      - npm run build
    sources: [package.json, vite.config.ts, tsconfig.json, src/**/*]
    generates: [build/index.html]

  android:
    desc: Build the Android app that opens the tracker's pages (needs ANDROID_HOME and a JDK); CI signs and attaches it to the latest release
    dir: apps/android
    sources:
      - app/build.gradle.kts
      - app/src/**/*
      - "*.gradle.kts"
    generates:
      - app/build/outputs/apk/release/app-release.apk
    cmds:
      - ./gradlew --quiet assembleRelease

  web-dev:
    desc: Serve the web app with hot reload, proxying to a tracker on port 7880 (task mock or task run)
    deps: [web-deps]
    dir: web
    cmds:
      - npm run dev -- {{.CLI_ARGS}}

  screenshot:
    desc: Render every page at phone and desktop widths against the mock tracker into dist/screenshots
    deps: [web]
    cmds:
      - cargo build -p cli --quiet
      - node web/tools/screenshot.mjs

  onnxruntime:
    desc: Put the platform's ONNX Runtime next to the release binary
    cmds:
      - uv pip install --python 3.12 --target target/onnxruntime --group onnxruntime
      - mkdir -p target/release
      - cp target/onnxruntime/onnxruntime/capi/libonnxruntime*.so* target/release/
    status:
      - ls target/release/libonnxruntime.so*

  run:
    desc: Live tracking; serves the socket, measures every hit and throw while a simulator is connected or a session is active
    deps: [web, onnxruntime]
    cmds:
      - cargo run -p cli --release --features oak --quiet -- watch {{.DATA}}

  replay:
    desc: Replay recorded clips (FROM=data/sessions/3) through the live path without the camera, on port 7881 beside a live tracker; GAP= seconds between clips, MODEL= for the model
    deps: [web, onnxruntime]
    cmds:
      - cargo run -p cli --release --quiet -- watch {{.DATA}}-replay --from {{.FROM}} --gap {{.GAP}} --model {{.MODEL | default "models/detector.onnx"}} --bind {{.BIND | default "0.0.0.0:7881"}}

  mock:
    deps: [web]
    desc: Serve the socket with no camera, making up a pitch or hit every PERIOD seconds; MODEL= for where Promote writes
    cmds:
      - cargo run -p cli --quiet -- mock {{.DATA}}-mock --period {{.PERIOD | default "4"}} --model {{.MODEL | default "models/detector.onnx"}}

  check:
    deps: [web]
    desc: Format, lint, and test
    cmds:
      - task: fmt
      - task: lint
      - task: test

  synth:
    desc: Write a synthetic clip
    cmds:
      - cargo run -p cli --quiet -- synth {{.DATA}}

  capture:
    desc: Live capture server
    cmds:
      - cargo run -p cli --release --features oak --quiet -- capture {{.DATA}}

  calibrate:
    desc: Solve the camera pose from the home plate
    cmds:
      - cargo run -p cli --release --features oak --quiet -- calibrate {{.DATA}}

  review:
    desc: Review recorded clips and events
    cmds:
      - cargo run -p cli --quiet -- review {{.DATA}}

  label:
    desc: Click the ball in saved frames
    cmds:
      - cargo run -p cli --quiet -- label {{.DATA}}

  train-env:
    internal: true
    cmds:
      - uv sync --python 3.12 --extra {{.TARGET | default "cuda"}}
      - .venv/bin/python -c "import torch, ultralytics; print('torch', torch.__version__, 'gpu', torch.cuda.is_available())"

  train:
    desc: Fine-tune a ball detector from labels and export ONNX (DATA may list several directories; TARGET=cuda|rocm)
    cmds:
      - task: train-env
        vars: { TARGET: "{{.TARGET}}" }
      - .venv/bin/python tools/train.py {{.DATA}}

  train-server:
    desc: Serve training over HTTP on port 7882 for a tracker on another machine (BIND=host:port, TARGET=cuda|rocm)
    cmds:
      - task: train-env
        vars: { TARGET: "{{.TARGET}}" }
      - .venv/bin/python tools/train_server.py --bind {{.BIND | default "0.0.0.0:7882"}}

  detect:
    desc: Detect balls in saved clips
    deps: [onnxruntime]
    cmds:
      - cargo run -p cli --release --quiet -- detect {{.DATA}} --model {{.MODEL | default "models/detector.onnx"}} {{if .CLIP}}--clip {{.CLIP}}{{end}}

  camera:
    desc: Open the OAK and write one frame
    cmds:
      - cargo run -p cli --release --features oak --quiet -- capture {{.DATA}} --once

  release:
    deps: [web]
    desc: Check, then build the tracker and what it needs to run into dist/release
    cmds:
      - task: check
      - cargo build -p cli --release --features oak
      - task: onnxruntime
      - rm -rf dist/release && mkdir -p dist/release
      - cp -a target/release/tracker target/release/*.so* LICENSE config.example.toml dist/release/

  fetch-release:
    desc: Download the latest Jetson bundle into dist/release instead of building it
    cmds:
      - rm -rf dist/release && mkdir -p dist/release
      - curl -fsSL https://github.com/jermatic1/baseball-tracker/releases/download/latest/tracker-jetson-aarch64.tar.gz | tar -xzf - -C dist/release

  docker-tracker:
    desc: Build the tracker image from dist/release, from task release or task fetch-release (TARGET=jetson)
    preconditions:
      - sh: test -x dist/release/tracker
        msg: "dist/release is missing: run task release, or task fetch-release on the Jetson"
    cmds:
      - docker build -f docker/tracker/Dockerfile --build-arg TARGET={{.TARGET | default "jetson"}} -t ghcr.io/jermatic1/baseball-tracker/tracker:{{.TARGET | default "jetson"}} .

  docker-train:
    desc: Build the training server image (TARGET=cuda|rocm)
    cmds:
      - docker build -f docker/train/Dockerfile --build-arg TARGET={{.TARGET | default "cuda"}} -t ghcr.io/jermatic1/baseball-tracker/train:{{.TARGET | default "cuda"}} .
