version: "3"

vars:
  DATA: '{{.DATA | default "data"}}'
  FROM: '{{.FROM | default "data"}}'
  GAP: '{{.GAP | default "1"}}'

tasks:
  build:
    desc: Build the tracker
    cmds:
      - cargo build -p cli

  build-oak:
    desc: Build capture with the OAK camera
    cmds:
      - cargo build -p cli --features oak

  test:
    desc: Run tracker tests
    cmds:
      - cargo test --workspace

  fmt:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy --workspace --all-targets --features oak -- -D warnings
      - cargo clippy -p cli --all-targets --no-default-features --features detect -- -D warnings

  onnxruntime:
    desc: Put the platform's ONNX Runtime next to the release binary
    cmds:
      - uv pip install --python 3.12 --target target/onnxruntime --group onnxruntime
      - mkdir -p target/release
      - cp target/onnxruntime/onnxruntime/capi/libonnxruntime*.so* target/release/
    status:
      - ls target/release/libonnxruntime.so*

  run:
    desc: Live tracking; serves the socket, measures every hit and throw while a client is connected
    deps: [onnxruntime]
    cmds:
      - cargo run -p cli --release --features oak --quiet -- watch {{.DATA}}

  replay:
    desc: Replay recorded clips (FROM=data/sessions/3) through the live path without the camera; GAP= seconds between clips
    deps: [onnxruntime]
    cmds:
      - cargo run -p cli --release --quiet -- watch {{.DATA}}-replay --from {{.FROM}} --gap {{.GAP}}

  mock:
    desc: Serve the socket with no camera, making up a pitch or hit every PERIOD seconds
    cmds:
      - cargo run -p cli --quiet -- mock {{.DATA}}-mock --period {{.PERIOD | default "4"}}

  check:
    desc: Format, lint, and test
    cmds:
      - task: fmt
      - task: lint
      - task: test

  synth:
    desc: Write a synthetic clip
    cmds:
      - cargo run -p cli --quiet -- synth {{.DATA}}

  capture:
    desc: Live capture server
    cmds:
      - cargo run -p cli --release --features oak --quiet -- capture {{.DATA}}

  calibrate:
    desc: Solve the camera pose from the home plate
    cmds:
      - cargo run -p cli --release --features oak --quiet -- calibrate {{.DATA}}

  review:
    desc: Review recorded clips and events
    cmds:
      - cargo run -p cli --quiet -- review {{.DATA}}

  label:
    desc: Click the ball in saved frames
    cmds:
      - cargo run -p cli --quiet -- label {{.DATA}}

  pull:
    desc: Copy clips not yet pulled from the Jetson (JETSON=[user@]host) into DATA (default sessions/jetson)
    vars:
      DEST: '{{if eq .DATA "data"}}sessions/jetson{{else}}{{.DATA}}{{end}}'
      TRACKER_DIR: '{{.TRACKER_DIR | default "~/tracker"}}'
    silent: true
    preconditions:
      - sh: test -n "{{.JETSON}}"
        msg: "usage: task pull JETSON=[user@]host [DATA=sessions/jetson] [TRACKER_DIR=~/tracker]"
    cmds:
      - |
        set -eu
        export RSYNC_RSH="ssh -o ControlMaster=auto -o ControlPath=/tmp/tracker-pull-%C -o ControlPersist=30"
        dest="{{.DEST}}"
        mkdir -p "$dest/clips"
        # One listing: the remote data path, then every clip as <name> <path>.
        listing=$($RSYNC_RSH "{{.JETSON}}" 'cd {{.TRACKER_DIR}}/data && pwd && for d in clips/*/ sessions/*/clips/*/; do
          [ -d "$d" ] || continue; d=${d%/}; case $d in
            sessions/*) s=${d#sessions/}; echo "s${s%%/*}-${d##*/} $d" ;;
            *) echo "${d##*/} $d" ;; esac; done')
        remote=$(echo "$listing" | head -n 1)
        for f in config.toml calibration.json; do
          [ -e "$dest/$f" ] || rsync -a --ignore-existing "{{.JETSON}}:$remote/$f" "$dest/" 2>/dev/null || echo "no $f on {{.JETSON}}"
        done
        echo "$listing" | tail -n +2 | while read -r name path; do
          [ -e "$dest/clips/$name" ] && continue
          rsync -a --ignore-existing "{{.JETSON}}:$remote/$path/" "$dest/clips/.partial-$name/" || exit 1
          mv "$dest/clips/.partial-$name" "$dest/clips/$name"
          echo "$name"
        done
        echo "clips in $dest/clips: $(ls "$dest/clips" | wc -l)"

  train:
    desc: Fine-tune a ball detector from labels and export ONNX (DATA may list several directories)
    env:
      UV_NO_PROJECT: "1"
    cmds:
      - uv venv --allow-existing --python 3.12 .venv
      - uv pip install --python .venv/bin/python ultralytics pillow --torch-backend=auto
      - uv pip uninstall --python .venv/bin/python opencv-python
      - uv pip install --python .venv/bin/python opencv-python-headless
      - .venv/bin/python -c "import torch, ultralytics; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
      - .venv/bin/python tools/train.py {{.DATA}}

  detect:
    desc: Detect balls in saved clips
    deps: [onnxruntime]
    cmds:
      - cargo run -p cli --release --quiet -- detect {{.DATA}} --model {{.MODEL | default "models/ball.onnx"}} {{if .CLIP}}--clip {{.CLIP}}{{end}}

  camera:
    desc: Open the OAK and write one frame
    cmds:
      - cargo run -p cli --release --features oak --quiet -- capture {{.DATA}} --once

  release:
    desc: Check, then build the tracker and what it needs to run into dist/release
    cmds:
      - task: check
      - cargo build -p cli --release --features oak
      - task: onnxruntime
      - rm -rf dist/release && mkdir -p dist/release
      - cp -a target/release/tracker target/release/*.so* LICENSE config.example.toml dist/release/
