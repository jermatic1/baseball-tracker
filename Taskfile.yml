version: "3"

vars:
  SESSION: '{{.SESSION | default "test-1"}}'

tasks:
  build:
    desc: Build the tracker
    cmds:
      - cargo build -p cli

  build-oak:
    desc: Build capture with the OAK camera
    cmds:
      - cargo build -p cli --features oak

  test:
    desc: Run tracker tests
    cmds:
      - cargo test --workspace

  fmt:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy --workspace --all-targets --features oak -- -D warnings

  check:
    desc: Format, lint, and test
    cmds:
      - task: fmt
      - task: lint
      - task: test

  synth:
    desc: Write a synthetic session
    cmds:
      - cargo run -p cli --quiet -- synth sessions/{{.SESSION}}

  capture:
    desc: Live capture server
    cmds:
      - cargo run -p cli --release --features oak --quiet -- capture sessions/{{.SESSION}}

  calibrate:
    desc: Solve the camera pose from the home plate
    cmds:
      - cargo run -p cli --release --features oak --quiet -- calibrate sessions/{{.SESSION}}

  review:
    desc: Review a session
    cmds:
      - cargo run -p cli --quiet -- review sessions/{{.SESSION}}

  label:
    desc: Click the ball in saved frames
    cmds:
      - cargo run -p cli --quiet -- label sessions/{{.SESSION}}

  train:
    desc: Fine-tune a ball detector from labels and export ONNX
    env:
      UV_NO_PROJECT: "1"
    cmds:
      - uv venv --allow-existing --python 3.12 .venv
      - uv pip install --python .venv/bin/python ultralytics pillow --torch-backend=auto
      - uv pip uninstall --python .venv/bin/python opencv-python
      - uv pip install --python .venv/bin/python opencv-python-headless
      - .venv/bin/python -c "import torch, ultralytics; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
      - .venv/bin/python tools/train.py sessions/{{.SESSION}}

  detect:
    desc: Detect balls in a saved session
    cmds:
      - cargo run -p cli --features detect --quiet -- detect sessions/{{.SESSION}} --model {{.MODEL | default "models/ball.onnx"}} {{if .CLIP}}--clip {{.CLIP}}{{end}}

  camera:
    desc: Open the OAK and write one frame
    cmds:
      - cargo run -p cli --release --features oak --quiet -- capture sessions/{{.SESSION}} --once

  release:
    desc: Release build for this machine
    cmds:
      - task: check
      - cargo build -p cli --release --features oak
      - mkdir -p dist/release
      - rm -rf dist/release/tracker dist/release/*.so dist/release/*.so.*
      - cp target/release/tracker dist/release/tracker
      - cp -a target/release/libavcodec.so* target/release/libavformat.so* target/release/libavutil.so* target/release/libavfilter.so* target/release/libavdevice.so* target/release/libswscale.so* target/release/libswresample.so* target/release/libusb-1.0.so* target/release/libdynamic_calibration.so* dist/release/
