[capture]
# 640x400 is the OV9282 binned mode. The OAK-D delivers about 200 frames a
# second across both eyes, so 100 fps is the highest rate with no drops.
width = 640
height = 400
fps = 100
exposure_us = 800
gain = 800

[mount]
distance_from_plate_m = 2.1
height_m = 0.8
lateral_offset_m = 0.5
pitch_deg = 0.0
yaw_deg = 0.0
# true if increasing stereo depth points toward right field
positive_depth_is_rf = true

[simulator]
launch_url = "http://127.0.0.1:7878/launch"
