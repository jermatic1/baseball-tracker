# Distances are feet, speeds mph, angles degrees, times seconds.

[capture]
# 640x400 is the OV9282 binned mode. The OAK-D delivers about 200 frames a
# second across both eyes, so 100 fps is the highest rate with no drops.
width = 640
height = 400
fps = 100
# Microseconds. 600 keeps a 70 mph ball round; drop to 400 for faster hitters.
# Gain adds no visible noise on this sensor, so run it at the maximum.
exposure = 600
gain = 1600

# Camera pose relative to the apex of the plate, the point at the back.
# Calibrate writes this; do not measure it by hand. These numbers are a level
# camera beside the ball path, 68 in to the first-base side, 34 in up, facing
# straight across with its centre line 31 in in front of the plate's front
# edge. distance is along the ground from the apex to the spot under the lens;
# lateral is positive on the first-base side. The angles are offsets from the
# line to the apex, not tilt from level: positive pitch tilts up, positive yaw
# turns the camera to its left (toward the catcher from the first-base side).
[mount]
distance = 6.94
height = 2.83
lateral = 5.67
pitch = 22.0
yaw = -35.2

[stereo]
# Only for sessions recorded without the camera's saved calibration: the
# disparity the raw eyes show at infinity, in pixels.
disparity_offset = 17.1

[tracking]
# Slowest batted ball reported as a hit. Pitches have no floor.
min_hit_velocity = 15.0

# Live watching. A detected ball that lands farther than motion pixels from
# every ball seen in the last tenth of a second has moved; the frames from
# preroll before that until settle after the last motion become a clip and
# are measured at once. keep_clips = false keeps only detections and events.
[watch]
motion = 4.0
preroll = 0.5
settle = 0.15
max_episode = 6.0
keep_clips = true

# Where the pitcher actually throws from, which release speed is read at,
# and the mound distance each pitch's plate location is projected to.
[pitching]
actual_distance = 46
simulated_distance = 46

[flight]
# Thinner air carries farther.
altitude = 0

# The strike zone, inches: centred on the plate, width across, bottom to top
# above the ground. Pitches are called on their simulated crossing.
[zone]
width = 17
bottom = 18
top = 42
