[capture]
# 640x400 is the OV9282 binned mode. The OAK-D delivers about 200 frames a
# second across both eyes, so 100 fps is the highest rate with no drops.
width = 640
height = 400
fps = 100
# 600 us keeps a 70 mph ball round; drop to 400 for faster hitters.
# Gain adds no visible noise on this sensor, so run it at the maximum.
exposure_us = 600
gain = 1600

# Camera beside the plate on the left-field side, looking across it so hits
# cross the image left to right. Measured: lens 1.74 m from the tee ball,
# 0.9 m up, the ball 0.65 m left of the camera axis.
[mount]
distance_from_plate_m = 1.74
height_m = 0.9
lateral_offset_m = -1.61
pitch_deg = 30.5
yaw_deg = 23.0
positive_depth_is_rf = true

[simulator]
launch_url = "http://127.0.0.1:7878/launch"

[stereo]
# The raw eyes are not rectified; this is the disparity they show at
# infinity. Calibrate from one measured distance: measured disparity minus
# fx * baseline / distance. 17.1 px on this OAK-D at 640 wide.
disparity_offset_px = 17.1

[tracking]
# Slowest batted ball reported as a hit. Pitches have no floor.
min_hit_mph = 15.0
