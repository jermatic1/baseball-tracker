# The challenges game: batters a user pitches to, the goals to work on, and
# which of each a user gets. A batter's look is mapped to a sprite by the
# front end; contact and power shape how the CPU batter responds.

[[batters]]
id = "slugger"
name = "SLUGGER"
number = 44
bats = "right"
throws = "right"
height = "tall"
build = "heavy"
skin = "dark"
stance = "open"
# Chance a swing at a strike makes contact, and typical exit velocity, mph.
contact = 0.5
power = 70

[[batters]]
id = "slap"
name = "SLAP"
number = 7
bats = "left"
throws = "left"
height = "short"
build = "slim"
skin = "light"
stance = "closed"
contact = 0.8
power = 50

[[batters]]
id = "rookie"
name = "ROOKIE"
number = 12
bats = "right"
throws = "right"
height = "average"
build = "average"
skin = "medium"
stance = "square"
contact = 0.6
power = 60

# target: any, strike, high, low, inside, outside, middle. Inside and
# outside follow the batter's hands. min_velocity is mph at release.
[[goals]]
id = "high"
text = "THROW HIGH"
target = "high"

[[goals]]
id = "low"
text = "KEEP IT LOW"
target = "low"

[[goals]]
id = "heat"
text = "BRING THE HEAT"
target = "strike"
min_velocity = 45

[[goals]]
id = "paint"
text = "PAINT THE CORNER"
target = "outside"

# A plan is a lineup: the batters in order, each with the goal at the same
# position (goals repeat if there are fewer). A plan with a user applies to
# that user by name; one without applies to everyone else.
[[plans]]
batters = ["slugger", "slap", "rookie"]
goals = ["high", "low", "heat"]
